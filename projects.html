<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Win's Portfolio - Projects</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="shortcut icon" href="asset/L0.png" type="image/x-icon" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/boxicons@latest/css/boxicons.min.css" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.4/font/bootstrap-icons.css" />
</head>
<body>

    <main id="pageContainer">
        <section class="thirdSection" id="projects">
            <div class="album-page">
                <h2 class="album-title">My Projects</h2>
                <div class="album-title-line"></div>

                <div class="album-chapter">
                    <div class="album-chapter-label">
                        <i class='bx bx-code-block'></i> Prototypes
                    </div>
                    <div class="project-grid scroll-stagger">
                        <div class="project-item scroll-hidden" style="animation:none;">
                            <i class='bx bx-code-block'></i>
                            <h3>TicTacToe</h3>
                            <p>Built using HTML, CSS, and JavaScript during Senior High School.</p>
                            <a href="#" title="View TicTacToe Project">
                                <img src="img/XOX.png" alt="TicTacToe Project Screenshot"
                                     style="width:100%;max-width:300px;height:auto;margin-top:15px;border-radius:5px;">
                            </a>
                        </div>

                        <div class="project-item scroll-hidden" style="animation:none;">
                            <i class='bx bx-mobile-alt'></i>
                            <h3>Interactive Map</h3>
                            <p>A simple webpage prototype showcasing the Map of the INTE and CS Building.</p>
                            <a href="#" title="View Interactive Map Project">
                                <img src="img/IM.png" alt="Interactive Map Project Screenshot"
                                     style="width:100%;max-width:300px;height:auto;margin-top:15px;border-radius:5px;">
                            </a>
                        </div>
                    </div>
                </div>

            </div>
        </section>
    </main>

    <script src="shared.js"></script>
    <script src="protect.js"></script>
    <script src="wei.js"></script>
</body>
</html>
